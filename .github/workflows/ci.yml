name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Replay the real migrations, not `db:push`. `push` builds tables from
      # schema.ts and therefore CANNOT create anything that lives only in SQL —
      # the gold `reward_task_status` view and the `reward_task_due_at()`
      # function among them. Prod runs `migrate()` at boot, so a CI that pushes
      # is testing a schema production never has.
      - name: Run migrations
        env:
          CLIENT_SERVICE_DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: pnpm db:migrate

      - name: Run tests
        env:
          CLIENT_SERVICE_DATABASE_URL: postgresql://test:test@localhost:5432/test
          CLERK_SECRET_KEY: test_clerk_secret_key
          CLIENT_SERVICE_API_KEY: test_api_key
        run: pnpm test

      - name: Build
        run: pnpm build
